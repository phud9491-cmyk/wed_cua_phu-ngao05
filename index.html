                showToast("Số dư Ví không đủ! Vui lòng nạp thêm.", "error");
                openDepositModal();
                return;
            }

            userBalance -= item.price;
            updateBalanceUI();

            // Save History
            userHistory.unshift({
                title: item.title,
                price: item.price,
                date: new Date().toLocaleString('vi-VN'),
                credential: item.credential
            });

            closeBuyModal();
            showToast(`Thanh toán thành công! Đã nhận thông tin gói.`, "success");
            openHistoryModal();
        }

            const item = productsData.find(p => p.id === productId);
            if (!item) return;

            userHistory.unshift({
                title: item.title,
                price: item.price,
                date: new Date().toLocaleString('vi-VN'),
                credential: item.credential
            });

            closeBuyModal();
            showToast(`Chuyển khoản thành công! Đã cấp ID/Tài khoản cho bạn.`, "success");
            openHistoryModal();
        }

        // CART LOGIC
        function addToCart(id) {
            const item = productsData.find(p => p.id === id);
            if (!item) return;
            cart.push(item);
            updateCartUI();
            showToast(`Đã thêm "${item.title}" vào giỏ hàng!`);
        }

        function updateCartUI() {
            document.getElementById('cartBadge').innerText = cart.length;
            const container = document.getElementById('cartItemsContainer');
            const totalElement = document.getElementById('cartTotalPrice');

            if (cart.length === 0) {
                container.innerHTML = `<p class="text-xs text-slate-500 text-center py-4">Giỏ hàng trống</p>`;
                totalElement.innerText = formatVND(0);
                return;
            }

            let total = 0;
            container.innerHTML = cart.map((item, index) => {
                total += item.price;
                return `
                    <div class="flex items-center justify-between gap-2 bg-slate-800/80 p-2.5 rounded-xl border border-slate-700">
                        <div class="truncate flex-1">
                            <h5 class="text-xs font-bold text-white truncate">${item.title}</h5>
                            <span class="text-[10px] text-purple-400 font-bold">${formatVND(item.price)}</span>
                        </div>
                        <button onclick="removeFromCart(${index})" class="text-slate-500 hover:text-red-400 text-xs px-2">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                    </div>
                `;
            }).join('');

            totalElement.innerText = formatVND(total);
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            updateCartUI();
        }

        function toggleCartModal() {
            document.getElementById('cartModal').classList.toggle('hidden');
        }

        function processCartCheckout() {
            if (cart.length === 0) {
                showToast("Giỏ hàng đang trống!", "error");
                return;
            }
            const total = cart.reduce((sum, item) => sum + item.price, 0);
            if (userBalance < total) {
                showToast("Số dư ví không đủ thanh toán toàn bộ giỏ hàng!", "error");
                toggleCartModal();
                openDepositModal();
                return;
            }

            userBalance -= total;
            updateBalanceUI();

            cart.forEach(item => {
                userHistory.unshift({
                    title: item.title,
                    price: item.price,
                    date: new Date().toLocaleString('vi-VN'),
                    credential: item.credential
                });
            });

            cart = [];
            updateCartUI();
            toggleCartModal();
            showToast("Thanh toán thành công toàn bộ đơn hàng trong giỏ!", "success");
            openHistoryModal();
        }

        // HISTORY DASHBOARD
        function openHistoryModal() {
            const container = document.getElementById('historyListContainer');
            if (userHistory.length === 0) {
                container.innerHTML = `<p class="text-xs text-slate-500 text-center py-8">Bạn chưa mua hoặc thuê tài khoản nào.</p>`;
            } else {
                container.innerHTML = userHistory.map(h => `
                    <div class="bg-slate-950 p-3.5 rounded-xl border border-slate-800 text-xs space-y-2">
                        <div class="flex justify-between items-start">
                            <div>
                                <h4 class="font-bold text-white text-sm">${h.title}</h4>
                                <span class="text-[10px] text-slate-500">${h.date}</span>
                            </div>
                            <span class="text-xs font-extrabold text-emerald-400">${formatVND(h.price)}</span>
                        </div>
                        <div class="bg-slate-900 p-2.5 rounded-lg border border-slate-800 text-amber-300 font-mono text-[11px] select-all break-all">
                            <i class="fa-solid fa-key mr-1 text-slate-400"></i> ${h.credential}
                        </div>
                    </div>
                `).join('');
            }
            document.getElementById('historyModal').classList.remove('hidden');
        }

        function closeHistoryModal() {
            document.getElementById('historyModal').classList.add('hidden');
        }

        // ADMIN QUICK CONFIG MODAL
        function openAdminModal() {
            document.getElementById('adminModal').classList.remove('hidden');
        }

        function closeAdminModal() {
            document.getElementById('adminModal').classList.add('hidden');
        }

        function saveAdminSettings(e) {
            e.preventDefault();
            adminBankConfig.bankId = document.getElementById('cfgBankId').value.trim().toUpperCase();
            adminBankConfig.accNum = document.getElementById('cfgAccNum').value.trim();
            adminBankConfig.accName = document.getElementById('cfgAccName').value.trim().toUpperCase();

            localStorage.setItem('appvault_admin_cfg', JSON.stringify(adminBankConfig));
            updateBankFooterText();
            closeAdminModal();
            showToast("Đã cập nhật cấu hình STK Ngân hàng chủ shop thành công!", "success");
        }

        // TOAST HELPER
        function showToast(msg, type = "success") {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toastMsg');
            const toastIcon = document.getElementById('toastIcon');

            toastMsg.innerText = msg;
            if (type === "error") {
                toastIcon.className = "fa-solid fa-circle-xmark text-red-400 text-lg";
            } else {
                toastIcon.className = "fa-solid fa-circle-check text-emerald-400 text-lg";
            }

            toast.classList.remove('translate-y-20', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');

            setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 3000);
        }

        function scrollToSection(id) {
            const el = document.getElementById(id);
            if (el) el.scrollIntoView({ behavior: 'smooth' });
        }
    </script>
</body>
</html>
